[package]
name = "zerostyl-orbit"
version = "0.1.0"
edition = "2021"
authors = ["kazai777 <kazai777.dev@gmail.com>"]
license = "MIT"
description = "Orbit zk-Adapter: per-chain gas/precompile/size profiles and deployability analysis for ZeroStyl on Arbitrum Orbit chains"
repository = "https://github.com/kazai777/zerostyl"
keywords = ["arbitrum", "stylus", "orbit", "zero-knowledge", "privacy"]
categories = ["cryptography", "development-tools"]

[dependencies]
zerostyl-circuits = { path = "../zerostyl-circuits" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
brotli = "3"

[dev-dependencies]
tempfile = "3.0"

[lib]
name = "zerostyl_orbit"
path = "src/lib.rs"

[[bin]]
name = "zerostyl-orbit"
path = "src/bin/zerostyl-orbit.rs"
