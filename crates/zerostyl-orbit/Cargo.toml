[package]
name = "zerostyl-orbit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Orbit zk-Adapter: per-chain gas/precompile/size profiles and deployability analysis for ZeroStyl on Arbitrum Orbit chains"
keywords = ["arbitrum", "stylus", "orbit", "zero-knowledge", "privacy"]
categories = ["cryptography", "development-tools"]

[dependencies]
zerostyl-circuits = { path = "../zerostyl-circuits", version = "0.1.0" }
serde = { workspace = true, features = ["std"] }
toml = "0.8"
thiserror = { workspace = true, features = ["std"] }
clap = { workspace = true }
anyhow = { workspace = true }
brotli = "3"

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "zerostyl_orbit"
path = "src/lib.rs"

[[bin]]
name = "zerostyl-orbit"
path = "src/bin/zerostyl-orbit.rs"
