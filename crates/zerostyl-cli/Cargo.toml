[package]
name = "zerostyl-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tools for ZeroStyl — proof generation and verification for halo2 circuits"
keywords = ["arbitrum", "stylus", "zero-knowledge", "privacy", "zk-snarks"]
categories = ["cryptography", "development-tools"]

[dependencies]
zerostyl-circuits = { path = "../zerostyl-circuits" }
example_demo = { path = "../../examples/example_demo" }
state_mask = { path = "../../examples/state_mask" }
tx_privacy = { path = "../../examples/tx_privacy" }
private_vote = { path = "../../examples/private_vote" }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "zerostyl_cli"
path = "src/lib.rs"

[[bin]]
name = "zerostyl-prove"
path = "src/main.rs"
