[package]
name = "zerostyl-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for the ZeroStyl zk toolkit on Arbitrum Stylus: circuit registry, proving, ABI loading, and proof encoding"
keywords = ["arbitrum", "stylus", "zero-knowledge", "privacy", "zk-snarks"]
categories = ["cryptography", "development-tools"]

[dependencies]
zerostyl-circuits = { path = "../zerostyl-circuits" }
zerostyl-runtime = { path = "../zerostyl-runtime" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }

[dev-dependencies]
zk_private_demo = { path = "../../examples/zk_private_demo" }
tempfile = { workspace = true }
