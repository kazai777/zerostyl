[package]
name = "zerostyl-sp1-script"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sp1-sdk = "=6.2.1"
zerostyl-verifier = { path = "../../zerostyl-verifier", default-features = false, features = ["std"] }
halo2_proofs = { version = "=0.3.0", default-features = false }
halo2curves = { version = "0.6", default-features = false, features = ["bits", "derive_serde"] }
postcard = "1.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[[bin]]
name = "zerostyl-sp1-script"
path = "src/main.rs"
