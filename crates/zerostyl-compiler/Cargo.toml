[package]
name = "zerostyl-compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compile halo2 zk-SNARKs circuits to WASM for Arbitrum Stylus contracts"
keywords = ["arbitrum", "stylus", "zero-knowledge", "privacy", "zk-snarks"]
categories = ["cryptography", "development-tools"]

[dependencies]
zerostyl-runtime = { path = "../zerostyl-runtime" }
zerostyl-gadgets = { path = "../zerostyl-gadgets" }
halo2_proofs = { version = "=0.3.0", features = ["dev-graph"] }
halo2curves = "0.6"
stylus-sdk = "0.9.0"
ruint = "=1.12.3"
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
thiserror = { workspace = true, features = ["std"] }
rand = "0.8"
hex = { workspace = true, features = ["std"] }
bincode = "1.3"
clap = { workspace = true }
# WASM code generation dependencies
wasmparser = "0.220"

[dev-dependencies]
tempfile = { workspace = true }