[package]
name = "state_mask"
version = "0.1.0"
edition = "2021"
authors = ["kazai777 <kazai777.dev@gmail.com>"]
license = "MIT"
publish = false

[dependencies]
# Circuit-only dependencies (no_std / wasm-compatible).
zerostyl-gadgets = { path = "../../crates/zerostyl-gadgets" }
halo2_proofs = { version = "=0.3.0", default-features = false, features = ["bits"] }
halo2curves = { version = "0.10", default-features = false, features = ["bits"] }

# std-only: the CircuitDescriptor (prover, witness JSON, MockProver reporting) lives behind the
# `std` feature so the circuit itself can be compiled for wasm32 without pulling the full compiler.
zerostyl-circuits = { path = "../../crates/zerostyl-circuits", optional = true }
zerostyl-compiler = { path = "../../crates/zerostyl-compiler", optional = true }
zerostyl-runtime = { path = "../../crates/zerostyl-runtime", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }

# On wasm32 a transitive dependency pulls getrandom; the `custom` feature lets the rlib build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["custom"] }

[features]
default = ["std"]
std = [
    "dep:zerostyl-circuits",
    "dep:zerostyl-compiler",
    "dep:zerostyl-runtime",
    "dep:serde",
    "dep:serde_json",
    "dep:hex",
    "halo2_proofs/dev-graph",
]

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"

[[bench]]
name = "circuit_bench"
harness = false
