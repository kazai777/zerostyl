# cargo-release configuration — https://github.com/crate-ci/cargo-release
#
# All workspace crates share one version (declared in the root Cargo.toml [workspace.package]).
# `cargo release <level>` bumps that single version, updates the CHANGELOG, commits, and tags.

# One version for the whole workspace; one tag per release (not one tag per crate).
shared-version = true
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

pre-release-commit-message = "chore(release): v{{version}}"
consolidate-commits = true

# Pushing and publishing are disabled here; they are performed as explicit steps. Not every crate
# is publishable to crates.io — see docs/RELEASING.md for the per-crate status and dependency order.
push = false
publish = false
