[workspace]
resolver = "2"
members = [
    "crates/zerostyl-circuits",
    "crates/zerostyl-gadgets",
    "crates/zerostyl-compiler",
    "crates/zerostyl-cli",
    "crates/zerostyl-debugger",
    "crates/zerostyl-exporter",
    "crates/zerostyl-runtime",
    "crates/zerostyl-sdk",
    "crates/zerostyl-orbit",
    "crates/zerostyl-verifier",
    "examples/example_demo",
    "examples/tx_privacy",
    "examples/state_mask",
    "examples/private_vote",
    "examples/zk_private_demo",
    "benchmarks/debug-workflow",
]

exclude = [
    "contracts/tx_privacy_verifier",
    "contracts/private_lending_pool",
    "contracts/state_mask_verifier",
    "contracts/private_vote_verifier",
    "contracts/private_swap_verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["kazai777 <kazai777.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/kazai777/zerostyl"

# Release profile optimized for Stylus (small WASM)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2.git", tag = "v0.3.0" }

# Shared dependency versions — a single source of truth. Crates use `{ workspace = true }` and opt
# into `std`/`alloc` as needed (the base is default-features = false so no_std members can compile).
[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = { version = "2", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = { version = "0.4", default-features = false }
tempfile = "3.0"
