version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/sdk-ts"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/packages/sdk-py"
    schedule:
      interval: "weekly"
