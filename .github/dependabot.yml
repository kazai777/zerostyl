version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned to 0.2 for its `custom` feature (no_std/wasm32 Stylus build).
      # 0.3+ removed that feature — see crates/zerostyl-gadgets/Cargo.toml.
      - dependency-name: "getrandom"
      # Governed by the pinned halo2 PSE fork ([patch.crates-io]); must not be
      # bumped independently or it conflicts with the fork's expected version.
      - dependency-name: "halo2curves"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/sdk-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Dev-only toolchain. Hold major upgrades and adopt them deliberately:
      # Biome 2 needs `biome migrate`, and TypeScript 7 (the new Go compiler) is
      # too fresh to pin a build to. Minor/patch updates still flow through.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/packages/sdk-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
