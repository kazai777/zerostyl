version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned to 0.2 for its `custom` feature (no_std/wasm32 Stylus build).
      # 0.3+ removed that feature — see crates/zerostyl-gadgets/Cargo.toml.
      - dependency-name: "getrandom"
        versions: [">= 0.3"]
      # Governed by the pinned halo2 PSE fork ([patch.crates-io]); must not be
      # bumped independently or it conflicts with the fork's expected version.
      - dependency-name: "halo2curves"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/sdk-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/packages/sdk-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
