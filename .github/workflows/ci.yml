name: CI

# Run CI on pushes to main/develop branches and all pull requests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Run tests across multiple platforms
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Linux: test all features including stylus
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --verbose

      # macOS/Windows: test without stylus (stylus-sdk is Linux/WASM only)
      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo test --workspace --verbose

  # Check code with clippy linter
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Check code formatting
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Build documentation to ensure it compiles
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Build the no_std verifier for wasm32 (the on-chain Stylus target) and report its size.
  wasm:
    name: WASM Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # The no_std gadgets crate must keep compiling for wasm32 — it is what lets user circuits
      # eventually be embedded in an on-chain verifier.
      - name: Build gadgets (no_std, wasm32)
        run: cargo build -p zerostyl-gadgets --target wasm32-unknown-unknown

      # no_std verifier must keep compiling for wasm32 (with and without the embedded VK).
      - name: Build verifier (no_std, wasm32)
        run: cargo build -p zerostyl-verifier --no-default-features --target wasm32-unknown-unknown

      - name: Build verifier (stylus + embedded_vk, wasm32, release)
        run: cargo build -p zerostyl-verifier --no-default-features --features "stylus,embedded_vk" --target wasm32-unknown-unknown --release

      # The real state_mask on-chain verifier must also keep compiling for wasm32.
      - name: Build verifier (stylus + state_mask_vk, wasm32, release)
        run: cargo build -p zerostyl-verifier --no-default-features --features "stylus,state_mask_vk" --target wasm32-unknown-unknown --release

      # Report compressed size — Arbitrum Stylus meters the Brotli-compressed contract.
      # This is the state_mask verifier (built last above).
      - name: Report WASM size
        run: |
          WASM=target/wasm32-unknown-unknown/release/zerostyl_verifier.wasm
          RAW=$(stat -c %s "$WASM")
          BR=$(brotli -c "$WASM" | wc -c)
          echo "raw: ${RAW} bytes ($((RAW/1024)) KB)"
          echo "brotli: ${BR} bytes ($((BR/1024)) KB)"
          echo "### WASM state_mask verifier size" >> "$GITHUB_STEP_SUMMARY"
          echo "- raw: $((RAW/1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          echo "- brotli: $((BR/1024)) KB" >> "$GITHUB_STEP_SUMMARY"

  # TypeScript SDK: lint, build, then test (bin spawn tests require dist/)
  sdk-ts:
    name: SDK TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @zerostyl/sdk-ts lint

      - name: Build
        run: pnpm --filter @zerostyl/sdk-ts build

      - name: Test
        run: pnpm --filter @zerostyl/sdk-ts test

  # Python SDK: lint then test (pure Python, no Rust toolchain needed)
  sdk-py:
    name: SDK Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest
